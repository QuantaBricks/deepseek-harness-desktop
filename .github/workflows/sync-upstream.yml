name: Sync upstream Harness and publish Windows desktop

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish a new Windows release without an upstream change
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '41 1 * * *'

permissions:
  contents: write

concurrency:
  group: harness-desktop-release
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out desktop repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml

      - name: Update official Harness submodule
        id: sync
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C deepseek-harness fetch origin master
          $pinned = git -C deepseek-harness rev-parse HEAD
          $official = git -C deepseek-harness rev-parse origin/master
          $forceRelease = '${{ inputs.force_release }}' -eq 'true'
          $mainPush = '${{ github.event_name }}' -eq 'push'
          $changed = $pinned -ne $official

          if ($changed) {
            git -C deepseek-harness checkout --detach $official
            git add deepseek-harness
          }

          if (-not $changed -and -not $forceRelease -and -not $mainPush) {
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "publish=true" >> $env:GITHUB_OUTPUT
          "source_updated=$changed" >> $env:GITHUB_OUTPUT
          "version=0.1.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
          "tag=desktop-v0.1.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT

      - name: Install Harness dependencies
        if: steps.sync.outputs.publish == 'true'
        run: pnpm --dir deepseek-harness install --frozen-lockfile

      - name: Build Harness Web UI
        if: steps.sync.outputs.publish == 'true'
        run: pnpm --dir deepseek-harness run build

      # The installer is self-contained. The runtime is archived before Tauri
      # sees it, so NSIS never traverses pnpm junctions.
      - name: Prepare embedded Harness runtime
        if: steps.sync.outputs.publish == 'true'
        shell: pwsh
        run: |
          $runtime = 'C:\dsh'
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          New-Item -ItemType Directory -Path $runtime | Out-Null
          pnpm --dir deepseek-harness deploy --filter @deepseek-ai/dsh --prod --legacy "$runtime\harness"
          Copy-Item (Get-Command node).Source "$runtime\node.exe"
          if (!(Test-Path "$runtime\harness\lib\bin.js")) {
            throw 'Embedded Harness deploy did not contain harness/lib/bin.js.'
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stage-runtime-packages.ps1 `
            -Source deepseek-harness `
            -Runtime "$runtime\harness"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/pack-core.ps1 `
            -Core $runtime `
            -Archive "$env:RUNNER_TEMP\harness-core.zip"

      - name: Install Rust
        if: steps.sync.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Stage Tauri Windows build
        if: steps.sync.outputs.publish == 'true'
        shell: pwsh
        run: |
          # Stage at a unique short path to keep Windows resource paths below
          # MAX_PATH without relying on runner-temp cleanup semantics.
          $stage = Join-Path $env:GITHUB_WORKSPACE ".dsh-build-$env:GITHUB_RUN_ID"
          $source = Join-Path $env:GITHUB_WORKSPACE 'tauri-core'
          $destination = Join-Path $stage 't'
          if (!(Test-Path -LiteralPath $source -PathType Container)) {
            throw "Tauri source directory was not found: $source"
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          # Runtime folders are generated artifacts and must not be copied
          # into the staged Tauri source; the release config injects the fresh
          # embedded archive explicitly below. Use native PowerShell copying so
          # the step does not depend on robocopy's special exit-code contract.
          $excluded = @('target', 'r', 'runtime', 'runtime-test', 'core', 'node_modules')
          Get-ChildItem -LiteralPath $source -Force |
            Where-Object { $excluded -notcontains $_.Name } |
            Copy-Item -Destination $destination -Recurse -Force
          if (!(Test-Path -LiteralPath (Join-Path $destination 'src-tauri\tauri.conf.json') -PathType Leaf)) {
            throw "Tauri source was copied but tauri.conf.json is missing from $destination"
          }

      - name: Create Tauri release config
        if: steps.sync.outputs.publish == 'true'
        shell: pwsh
        env:
          DESKTOP_VERSION: ${{ steps.sync.outputs.version }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE ".dsh-build-$env:GITHUB_RUN_ID"
          $config = Get-Content "$stage\t\src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json
          $config.version = $env:DESKTOP_VERSION
          $resources = [ordered]@{
            "$env:RUNNER_TEMP\harness-core.zip" = 'r/harness-core.zip'
          }
          $config.bundle | Add-Member -MemberType NoteProperty -Name resources -Value $resources -Force
          $releaseConfig = $config | ConvertTo-Json -Depth 100
          $releaseConfig | Set-Content "$stage\t\src-tauri\tauri.release.conf.json" -Encoding utf8

      - name: Install Tauri build dependencies
        if: steps.sync.outputs.publish == 'true'
        shell: pwsh
        run: pnpm --dir "$env:GITHUB_WORKSPACE\.dsh-build-$env:GITHUB_RUN_ID\t" install --frozen-lockfile

      - name: Build signed Windows installer
        if: steps.sync.outputs.publish == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE ".dsh-build-$env:GITHUB_RUN_ID"
          pnpm --dir "$stage\t" exec tauri build --config src-tauri/tauri.release.conf.json

      - name: Generate Tauri updater manifest
        if: steps.sync.outputs.publish == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.sync.outputs.tag }}
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          $bundle = Resolve-Path (Join-Path $env:GITHUB_WORKSPACE ".dsh-build-$env:GITHUB_RUN_ID\t\src-tauri\target\release\bundle\nsis")
          $installer = Get-ChildItem $bundle -Filter '*-setup.exe' | Select-Object -First 1
          $signature = Get-Content "$($installer.FullName).sig" -Raw
          $manifest = [ordered]@{
            version = $env:VERSION
            notes = "DeepSeek Harness Desktop $env:VERSION"
            pub_date = [DateTime]::UtcNow.ToString('o')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature.Trim()
                url = "https://github.com/QuantaBricks/deepseek-harness-desktop/releases/download/$env:TAG/$($installer.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $bundle 'latest.json') -Encoding utf8

      - name: Commit updated Harness pointer
        if: steps.sync.outputs.publish == 'true' && steps.sync.outputs.source_updated == 'True'
        id: commit
        shell: pwsh
        run: |
          git commit -m "chore: sync DeepSeek Harness"
          git push origin HEAD:main
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Choose release commit
        if: steps.sync.outputs.publish == 'true' && steps.sync.outputs.source_updated != 'True'
        id: current
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Publish GitHub Release
        if: steps.sync.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.tag }}
          VERSION: ${{ steps.sync.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha || steps.current.outputs.sha }}
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE ".dsh-build-$env:GITHUB_RUN_ID\t\src-tauri\target\release\bundle"
          if (!(Test-Path -LiteralPath $bundle -PathType Container)) {
            throw "Tauri bundle directory was not found: $bundle"
          }
          $assets = Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe', '.sig' -or $_.Name -eq 'latest.json' } |
            ForEach-Object { $_.FullName }
          if ($assets.Count -eq 0) {
            throw 'Tauri build did not produce release assets.'
          }
          gh release create $env:TAG --target $env:RELEASE_SHA --title "DeepSeek Harness Desktop $env:VERSION" --generate-notes $assets
