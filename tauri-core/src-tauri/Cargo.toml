[package]
name = "dsh-tauri-shell"
version = "0.1.0"
description = "Decoupled Tauri shell for DeepSeek Harness"
authors = ["DeepSeek Harness contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
junction = "1"
tauri = { version = "2.5", features = [] }
tauri-plugin-updater = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
