<!doctype html><meta charset="utf-8"><title>DeepSeek Harness</title><style>body{font:16px system-ui;display:grid;place-items:center;height:100vh;margin:0;background:#f8fafc;color:#164f9f}main{max-width:440px;text-align:center;padding:32px}p,small{color:#475569}button{margin:14px;padding:10px 18px;border:0;border-radius:7px;background:#164f9f;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.6}</style><main><h2>DeepSeek Harness</h2><p id="status">Harness 内核尚未安装，或有可用更新。</p><button id="install">下载并启动内核</button><small>仅下载已发布的内核资产，不在本机下载源码或执行构建。</small></main><script>const b=document.querySelector('#install'),s=document.querySelector('#status');b.onclick=async()=>{b.disabled=true;s.textContent='正在下载并验证内核…';try{await window.__TAURI__.core.invoke('install_or_update_core');s.textContent='正在启动…'}catch(e){s.textContent='更新失败：'+e;b.disabled=false}};</script>
